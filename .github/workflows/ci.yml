name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The seed must match the typed config; a diff here means someone edited one without the other.
      - run: pnpm db:seed:gen && git diff --exit-code supabase/seed.sql
      - run: pnpm build
        env:
          PHONE_HASH_PEPPER: ci-pepper-0123456789abcdef
          TOOL_SHARED_SECRET: ci-tool-secret-0123456789
